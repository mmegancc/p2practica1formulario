<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Iniciar Sesión </title>
<style>
body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px;
            background-color: #f9f9f9;
        }

        .contenedor {
            background-color: white;
            max-width: 400px;
            margin: 0 auto;
            padding: 30px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .bloque {
            margin-bottom: 20px;
        }

        label {
            display: block;
            text-align: left;
            font-size: 14px;
            margin-bottom: 5px;
            color: #555;
        }
        input[type="email"], input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .boton-negro {
            width: 100%;
            background-color: #222;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
}

    </style>
</head>
<body>

<div class="contenedor">
        
<div class="bloque">
<h3>Ingresar usando</h3>
</div>

<hr>
<form action="registrar.php" method="POST">
    
    <div class="bloque">
        <label>Dirección de correo electrónico</label>
        <input type="email" name="correo" required>
    </div>

    <div class="bloque">
        <label>Contraseña</label>
        <input type="password" name="contrasena" required>
    </div>

    <div class="bloque">
        <label>Domicilio</label>
        <input type="text" name="domicilio" required>
    </div>

    <div class="bloque">
        <label>colonia</label>
        <input type="text" name="colonia" required>
    </div>

    <div class="bloque">
        <label>Codigo postal</label>
        <input type="text" name="codigo_postal" required>
    </div>

    <div class="bloque">
        <label>Selecciona tu pais</label>
        <select name="pais">
<option value="1">Mexico</option>
<option value="2">España</option>
<option value="3">Guatemala</option>
<option value="4">Honduras</option>
<option value="5">El Salvador</option>
<option value="5">El Salvador</option>
<option value="6">Venezuela</option>
<option value="7">Colombia</option>
<option value="8">Estados Unidos</option>
<option value="9">Chile</option>
</select>
</div>

<button type="submit" class="boton-negro">CREAR CUENTA</button>
<p>ir al inicio <a href="index.html">Inicio</a></p>
</form>
</div>

</body>
</html>
